<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ブライダル美容タスク管理（デモ版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F3; --card:#FFFFFF; --ink:#3A3533; --sub:#8A817B; --line:#E8E0D8;
    --rose:#B76E79; --rose-dark:#96525E; --rose-bg:#F7ECEE;
    --amber:#C8901F; --amber-bg:#FBF3E2;
    --red:#B03A2E; --red-bg:#FBEAE8;
    --green:#4A7C59; --green-bg:#EAF2ED;
    --blue:#5B7FA6; --blue-bg:#EAF0F6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--bg); color:var(--ink); font-family:'Noto Sans JP',sans-serif; font-size:15px; line-height:1.6;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink); background:#fff;
    border:1px solid var(--line); border-radius:8px; padding:9px 10px; width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--rose); outline-offset:0; border-color:var(--rose);}
  label{font-size:12.5px; color:var(--sub); font-weight:500; display:block; margin-bottom:3px;}
  .req::after{content:"必須"; background:var(--red); color:#fff; font-size:10px; border-radius:4px;
    padding:1px 5px; margin-left:6px; vertical-align:1px;}
  .serif{font-family:'Noto Serif JP',serif;}
  .app-header{position:sticky; top:0; z-index:30; background:rgba(250,247,243,.96); backdrop-filter:blur(4px);
    border-bottom:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; gap:10px;}
  .app-title{font-family:'Noto Serif JP',serif; font-size:17px; font-weight:600; letter-spacing:.06em;}
  .ver{font-size:10.5px; color:var(--sub);}
  .userchip{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--sub);}
  .avatar{width:28px; height:28px; border-radius:50%; color:#fff; display:flex; align-items:center;
    justify-content:center; font-size:12px; font-weight:700; flex:none;}
  .nav-desktop{display:flex; gap:4px; padding:8px 12px 0; border-bottom:1px solid var(--line);
    background:var(--bg); position:sticky; top:49px; z-index:29; overflow-x:auto;}
  .nav-desktop button{background:none; border:none; border-bottom:3px solid transparent; padding:8px 14px 10px;
    font-size:14px; color:var(--sub); white-space:nowrap; font-weight:500;}
  .nav-desktop button.on{color:var(--rose-dark); border-bottom-color:var(--rose); font-weight:700;}
  .nav-mobile{display:none;}
  .main{max-width:1080px; margin:0 auto; padding:16px 16px 90px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px;}
  .card h2{font-family:'Noto Serif JP',serif; font-size:16px; margin-bottom:10px; letter-spacing:.04em;}
  .card h3{font-size:13.5px; color:var(--rose-dark); margin:14px 0 8px; padding-left:8px; border-left:3px solid var(--rose);}
  .badge{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700;
    border-radius:999px; padding:2px 10px; white-space:nowrap;}
  .b-hon{background:var(--rose-bg); color:var(--rose-dark); border:1px solid var(--rose);}
  .b-kari{background:var(--amber-bg); color:var(--amber); border:1px solid var(--amber);}
  .b-warn{background:var(--red-bg); color:var(--red); border:1px solid var(--red);}
  .b-ok{background:var(--green-bg); color:var(--green); border:1px solid var(--green);}
  .b-info{background:var(--blue-bg); color:var(--blue); border:1px solid var(--blue);}
  .b-gray{background:#F1EDE8; color:var(--sub); border:1px solid var(--line);}
  .btn{border:none; border-radius:10px; padding:10px 18px; font-size:14px; font-weight:700;}
  .btn-main{background:var(--rose); color:#fff;}
  .btn-main:active{background:var(--rose-dark);}
  .btn-sub{background:#fff; color:var(--rose-dark); border:1.5px solid var(--rose);}
  .btn-ghost{background:#F1EDE8; color:var(--ink);}
  .btn-sm{padding:6px 12px; font-size:12.5px; border-radius:8px;}
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .cust-card{cursor:pointer; transition:box-shadow .15s;}
  .cust-card:hover{box-shadow:0 3px 14px rgba(160,120,110,.15);}
  .cust-name{font-family:'Noto Serif JP',serif; font-size:17px; font-weight:600;}
  .meta{font-size:12.5px; color:var(--sub);}
  .chip{display:inline-block; font-size:11.5px; background:#F5F1EC; border:1px solid var(--line);
    border-radius:6px; padding:2px 8px; margin:2px 4px 2px 0;}
  .chip.ev-main{background:var(--rose-bg); border-color:var(--rose); color:var(--rose-dark); font-weight:700;}
  .fchip{border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:5px 13px;
    font-size:12.5px; color:var(--sub); font-weight:500;}
  .fchip.on{border-color:var(--rose); background:var(--rose-bg); color:var(--rose-dark); font-weight:700;}
  .thumb{width:48px; height:48px; border-radius:50%; object-fit:cover; border:2px solid var(--rose-bg); flex:none; cursor:zoom-in;}
  .thumb-none{width:48px; height:48px; border-radius:50%; background:#F1EDE8; color:#C4BBB1; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:20px;}
  .dots{display:flex; gap:3px; align-items:center;}
  .dot{width:16px; height:16px; border-radius:50%; font-size:9px; display:flex; align-items:center;
    justify-content:center; color:#fff; background:#DDD5CC; flex:none;}
  .dot.done{background:var(--rose);}
  .dot.na{background:#EFEAE4; color:#C4BBB1;}
  .cal{width:100%; border-collapse:collapse; table-layout:fixed;}
  .cal th{font-size:11.5px; color:var(--sub); padding:4px 0; font-weight:500;}
  .cal td{border:1px solid var(--line); height:80px; vertical-align:top; padding:3px; cursor:pointer; background:#fff;}
  .cal td:hover{background:var(--rose-bg);}
  .cal td.other{background:#F6F2ED; color:#C4BBB1; cursor:default;}
  .cal td.today .dnum{background:var(--rose); color:#fff; border-radius:50%;}
  .dnum{font-size:12px; width:22px; height:22px; display:flex; align-items:center; justify-content:center;}
  .cal-ev{font-size:10px; border-radius:4px; padding:0 3px; margin-top:2px; overflow:hidden;
    white-space:nowrap; text-overflow:ellipsis; font-weight:700;}
  .cal-hon{background:var(--rose-bg); color:var(--rose-dark); border-left:3px solid var(--rose);}
  .cal-kari{background:var(--amber-bg); color:var(--amber); border-left:3px solid var(--amber);}
  .cal-kyuka{background:#EFEAE4; color:#7A716A; border-left:3px solid #B4A99E;}
  .sched-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:#fff;}
  .sched{display:grid; min-width:900px;}
  .sc-head{font-size:11px; color:var(--sub); text-align:center; border-left:1px solid var(--line); padding:4px 0;}
  .sc-staff{position:sticky; left:0; background:#FBF8F4; z-index:2; border-top:1px solid var(--line);
    padding:8px; font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .sc-cell{border-top:1px solid var(--line); border-left:1px solid #F1EBE4; position:relative;}
  .sc-cell.kyuka{background:repeating-linear-gradient(45deg,#F6F2ED,#F6F2ED 8px,#EFEAE4 8px,#EFEAE4 16px);}
  .sc-block{position:absolute; top:4px; bottom:4px; border-radius:7px; font-size:11px; line-height:1.35;
    padding:4px 6px; overflow:hidden; color:#fff; cursor:pointer; z-index:1;}
  .sc-block.conflict{outline:3px solid var(--red); outline-offset:-1px;}
  .guest-table{width:100%; border-collapse:collapse; font-size:13px;}
  .guest-table th{background:#F5F1EC; font-size:11.5px; color:var(--sub); padding:6px; text-align:left; font-weight:500;}
  .guest-table td{border-top:1px solid var(--line); padding:7px 6px; vertical-align:top;}
  .est-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .est-table th{background:#F5F1EC; padding:7px 6px; font-size:12px; color:var(--sub); font-weight:500;}
  .est-table td{border-top:1px solid var(--line); padding:8px 6px;}
  .num{text-align:right; font-variant-numeric:tabular-nums;}
  .photo-grid{display:flex; gap:8px; flex-wrap:wrap;}
  .photo-item{position:relative;}
  .photo-item img{width:86px; height:86px; object-fit:cover; border-radius:10px; border:1px solid var(--line); cursor:zoom-in;}
  .photo-del{position:absolute; top:-6px; right:-6px; background:var(--red); color:#fff; border:none;
    width:22px; height:22px; border-radius:50%; font-size:12px; line-height:1;}
  .modal-bg{position:fixed; inset:0; background:rgba(58,53,51,.45); z-index:60; display:flex;
    align-items:center; justify-content:center; padding:16px;}
  .modal{background:#fff; border-radius:16px; padding:20px; width:100%; max-width:460px;
    max-height:88vh; overflow-y:auto;}
  .modal.wide{max-width:640px;}
  .field{margin-bottom:10px;}
  .alert-strip{background:var(--red-bg); border:1px solid var(--red); border-radius:12px;
    padding:10px 14px; margin-bottom:14px; font-size:13.5px;}
  .kv{display:grid; grid-template-columns:110px 1fr; font-size:13.5px; border-top:1px solid #F1EBE4; padding:6px 0;}
  .kv .k{color:var(--sub); font-size:12px; padding-top:1px;}
  .empty-val{color:#C9463A; font-weight:700; font-size:12.5px;}
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-box{background:#fff; border:1px solid var(--line); border-radius:20px; padding:32px 26px;
    width:100%; max-width:400px; text-align:center;}
  .staff-pick{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:14px 0;}
  .staff-pick button{display:flex; align-items:center; gap:7px; border:1.5px solid var(--line);
    background:#fff; border-radius:999px; padding:7px 14px; font-size:13.5px;}
  .staff-pick button.on{border-color:var(--rose); background:var(--rose-bg); font-weight:700;}
  .section-note{font-size:12px; color:var(--sub); background:#F5F1EC; border-radius:8px; padding:8px 12px; margin-bottom:12px;}
  .hist{font-size:12.5px; border-left:3px solid var(--line); padding:2px 0 2px 12px; margin:6px 0;}
  .fab{position:fixed; right:18px; bottom:84px; z-index:40; background:var(--amber); color:#fff;
    border:none; border-radius:999px; padding:13px 20px; font-size:14px; font-weight:700;
    box-shadow:0 4px 14px rgba(150,110,30,.35);}
  .lightbox{position:fixed; inset:0; background:rgba(30,25,23,.85); z-index:80; display:flex;
    flex-direction:column; align-items:center; justify-content:center; padding:20px; gap:12px; overflow-y:auto;}
  .lightbox img{max-width:min(92vw,720px); max-height:70vh; border-radius:12px;}
  @media(min-width:768px){ .fab{bottom:24px;} }
  @media(max-width:767px){
    .nav-desktop{display:none;}
    .nav-mobile{display:flex; position:fixed; bottom:0; left:0; right:0; z-index:50;
      background:#fff; border-top:1px solid var(--line); padding:4px 2px calc(4px + env(safe-area-inset-bottom));}
    .nav-mobile button{flex:1; background:none; border:none; font-size:9.5px; color:var(--sub);
      display:flex; flex-direction:column; align-items:center; gap:1px; padding:5px 0; min-height:48px;}
    .nav-mobile button.on{color:var(--rose-dark); font-weight:700;}
    .nav-mobile .ico{font-size:18px;}
    .grid2{grid-template-columns:1fr 1fr;}
    .main{padding:12px 12px 100px;}
    .kv{grid-template-columns:96px 1fr;}
  }
</style>
</head>

/* ---------- タスク漏れチェック・進捗 ---------- */
const REQUIRED_FIELDS = [
  ["bride","name","新婦のお名前"], ["bride","contact","新婦の連絡先"],
  ["groom","name","新郎のお名前"],
  ["use","date","本使用日"], ["use","venue","使用場所"], ["use","style","挙式スタイル"],
  ["use","beautyStart","美容開始時間"], ["use","start","スタート時間"],
];
function missingList(c){
  if(c.status !== "本契約") return [];
  if(c.use.date && c.use.date < iso(TODAY)) return [];
  const miss = [];
  REQUIRED_FIELDS.forEach(([sec, key, label]) => {
    const v = (c[sec]||{})[key];
    if(!v || (Array.isArray(v) && v.length===0)) miss.push(label);
  });
  if(!c.use.staffIds || c.use.staffIds.length===0) miss.push("スタッフ担当");
  if(!c.estimates || c.estimates.length===0) miss.push("お見積書");
  return miss;
}
const STEPS = ["新規見積","新規カルテ","打合せカルテ","中途見積","スケジュール","最終確認","請求書"];
function nextEvent(c){
  const t = iso(TODAY);
  const fut = (c.events||[]).filter(e => e.date >= t).sort((a,b)=>a.date.localeCompare(b.date));
  return fut[0] || null;
}
function estTotals(est){
  let gross=0, disc=0;
  est.items.forEach(it => { gross += it.qty*it.price; disc += it.disc||0; });
  return { gross, disc, net: gross-disc };
}
const custName = (c) => (c.bride.name || c.groom.name || "（名前未入力）");

/* ---------- スタッフ重複・休暇チェック ---------- */
const rangesOverlap = (t1, d1, t2, d2) => t1 < t2 + d2 && t2 < t1 + d1;
function checkEventConflicts(customers, vacations, staffAll, custId, eventId, ev){
  const msgs = [];
  const sName = (id) => { const s = staffAll.find(x=>x.id===id); return s ? s.name : "?"; };
  (ev.staffIds||[]).forEach(sid => {
    if(vacations.some(v => v.staffId===sid && v.date===ev.date))
      msgs.push(sName(sid)+" はこの日「休暇」です");
    if(!ev.time) return;
    customers.forEach(c2 => (c2.events||[]).forEach(e2 => {
      if(c2.id===custId && e2.id===eventId) return;
      if(e2.date!==ev.date || !e2.time || !(e2.staffIds||[]).includes(sid)) return;
      if(rangesOverlap(toH(ev.time), ev.dur||2, toH(e2.time), e2.dur||2))
        msgs.push(sName(sid)+"："+custName(c2)+" 様の"+e2.type+"（"+e2.time+"〜）と時間が重なっています");
    }));
  });
  return [...new Set(msgs)];
}

/* ---------- 画像縮小 ---------- */
function shrinkImage(file, cb){
  const fr = new FileReader();
  fr.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const max = 800;
      const sc = Math.min(1, max/Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL("image/jpeg", 0.8));
    };
    img.src = ev.target.result;
  };
  fr.readAsDataURL(file);
}

            <tr key={r}>
              {cells.slice(r*7,(r+1)*7).map((d,i) => {
                if(!d) return <td key={i} className="other"></td>;
                const dstr = y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
                const evs = evOf(dstr);
                const vacs = vacations.filter(v=>v.date===dstr);
                const isToday = dstr === iso(TODAY);
                return (
                  <td key={i} className={isToday?"today":""} onClick={()=>onPickDate(dstr)}>
                    <div className="dnum">{d}</div>
                    {vacs.map((v,j)=><div key={"v"+j} className="cal-ev cal-kyuka">休 {sName(v.staffId)}</div>)}
                    {evs.slice(0,3).map((x,j) => (
                      <div key={j} className={"cal-ev "+(x.c.status==="仮予約"?"cal-kari":"cal-hon")}>
                        {(x.c.bride.name || x.c.groom.name || "?").split(" ")[0]}・{x.e.type}
                      </div>
                    ))}
                    {evs.length > 3 && <div className="meta" style={{fontSize:10}}>ほか{evs.length-3}件</div>}
                    {evs.length > 0 && <div className="meta" style={{fontSize:10}}>計{evs.length}件</div>}
                  </td>
                );
              })}
            </tr>
          ))}
        </tbody>
      </table>
      {showVac && <VacationModal masters={masters} vacations={vacations} setVacations={setVacations}
        onClose={()=>setShowVac(false)}/>}
    </div>
  );
}

function EventEditModal({ c, e, customers, vacations, masters, onSave, onOpenKarte, onClose }){
  const staffAll = [...masters.staff, ...masters.vendors];
  const [form, setForm] = useState({ date:e.date, time:e.time, dur:e.dur||2, staffIds:[...(e.staffIds||[])], note:e.note||"" });
  const [errs, setErrs] = useState([]);
  const toggle = (sid) => setForm(f => ({...f,
    staffIds: f.staffIds.includes(sid) ? f.staffIds.filter(x=>x!==sid) : [...f.staffIds, sid]}));
  const trySave = (ignore) => {
    const conflicts = checkEventConflicts(customers, vacations, staffAll, c.id, e.id, form);
    if(conflicts.length && !ignore){ setErrs(conflicts); return; }
    onSave(c.id, e.id, form);

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={ev=>ev.stopPropagation()}>
        <h2 className="serif" style={{fontSize:17, marginBottom:2}}>{custName(c)} 様／{e.type}</h2>

        <div className="grid2">
          <div className="field"><label>日付</label>
            <input type="date" value={form.date} onChange={ev=>setForm(f=>({...f, date:ev.target.value}))}/></div>
          <div className="field"><label>開始時間</label>

        </div>

          <select value={form.dur} onChange={ev=>setForm(f=>({...f, dur:Number(ev.target.value)}))}>
            {[0.5,1,1.5,2,2.5,3,3.5,4,5,6,7,8].map(h=><option key={h} value={h}>{h}時間</option>)}
          </select></div>
        <div className="field"><label>担当スタッフ・外注先（複数OK）</label>
          <div className="row" style={{gap:6}}>
            {staffAll.map(s => (
              <button key={s.id} type="button"

                onClick={()=>toggle(s.id)}>{s.name.split("（")[0].split(" ")[0]}</button>
            ))}
          </div></div>
        <div className="field"><label>メモ</label>
          <input value={form.note} onChange={ev=>setForm(f=>({...f, note:ev.target.value}))}/></div>
        {errs.length > 0 && (
          <div className="alert-strip">
            <b>⚠ このままでは登録できません</b>
            {errs.map((m,i)=><div key={i}>・{m}</div>)}
            <button className="btn btn-ghost btn-sm" style={{marginTop:6}} onClick={()=>trySave(true)}>エラーを無視して保存する</button>
          </div>
        )}
        <div className="row" style={{marginTop:6}}>
          <button className="btn btn-main" style={{flex:1}} onClick={()=>trySave(false)}>保存</button>
          <button className="btn btn-sub" onClick={()=>onOpenKarte(c.id)}>📋 カルテ</button>
          <button className="btn btn-ghost" onClick={onClose}>閉じる</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- タイムスケジュール ---------- */
const HOURS_START = 7, HOURS_END = 19, HOUR_W = 72;
function ScheduleView({ customers, masters, vacations, date, setDate, onOpenEdit }){
  const rows = [...masters.staff, ...masters.vendors];
  const staffAll = rows;
  const t = date;
  const blocks = [];
  customers.forEach(c => (c.events||[]).forEach(e => {
    if(e.date !== t || !e.time) return;
    const startH = toH(e.time);
    const item = { c, e, startH, dur: e.dur || 2 };
    if(!e.staffIds || e.staffIds.length===0) blocks.push({ ...item, staffId:"none" });
    else e.staffIds.forEach(sid => blocks.push({ ...item, staffId:sid }));
  }));
  const unassigned = blocks.filter(b => b.staffId === "none");
  const conflictKeys = new Set();
  const conflictMsgs = [];
  rows.forEach(s => {
    const bs = blocks.filter(b => b.staffId===s.id);
    const onVac = vacations.some(v => v.staffId===s.id && v.date===t);
    if(onVac) bs.forEach(b => {
      conflictKeys.add(b.c.id+"|"+b.e.id+"|"+s.id);
      conflictMsgs.push(s.name+" は休暇なのに「"+custName(b.c)+" 様／"+b.e.type+"」の担当になっています");
    });
    for(let i=0;i<bs.length;i++) for(let j=i+1;j<bs.length;j++){
      if(rangesOverlap(bs[i].startH, bs[i].dur, bs[j].startH, bs[j].dur)){
        conflictKeys.add(bs[i].c.id+"|"+bs[i].e.id+"|"+s.id);
        conflictKeys.add(bs[j].c.id+"|"+bs[j].e.id+"|"+s.id);
        conflictMsgs.push(s.name+"："+custName(bs[i].c)+" 様と "+custName(bs[j].c)+" 様の時間が重なっています");
      }
    }
  });
  const moveDay = (n) => { const d = new Date(t+"T00:00:00"); d.setDate(d.getDate()+n); setDate(iso(d)); };
  const gridCols = { gridTemplateColumns: "130px repeat("+(HOURS_END-HOURS_START)+", "+HOUR_W+"px)" };
  return (
    <div>
      <div className="card">
        <div className="row" style={{alignItems:"center"}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>moveDay(-1)}>‹ 前日</button>
          <h2 style={{margin:"0 auto"}}>{jpLong(t)} のタイム表</h2>
          <button className="btn btn-ghost btn-sm" onClick={()=>moveDay(1)}>翌日 ›</button>
        </div>
        <div className="meta" style={{margin:"6px 0 10px"}}>横＝時間、縦＝スタッフ（外注先も含む）。ブロックをタップで時間・担当を編集できます</div>
        {conflictMsgs.length > 0 && (
          <div className="alert-strip">
            <b>🚨 スタッフの予定が重なっています（{conflictMsgs.length}件）</b>
            {[...new Set(conflictMsgs)].map((m,i)=><div key={i}>・{m}</div>)}
          </div>
        )}
        {unassigned.length > 0 && (
          <div className="alert-strip">⚠ <b>担当スタッフが未割り当ての予定が {unassigned.length}件</b> あります（最下段に表示）</div>
        )}
        <div className="sched-wrap">
          <div className="sched" style={gridCols}>
            <div className="sc-staff" style={{borderTop:"none"}}></div>
            {Array.from({length:HOURS_END-HOURS_START},(_,i)=>(
              <div key={i} className="sc-head">{HOURS_START+i}:00</div>
            ))}
            {rows.map(s => {
              const vac = vacations.find(v => v.staffId===s.id && v.date===t);
              return (
              <React.Fragment key={s.id}>
                <div className="sc-staff">
                  <span className="avatar" style={{background:s.color}}>{s.name[0]}</span>{s.name}
                  {vac && <span className="badge b-gray">🌴休暇{vac.note?"("+vac.note+")":""}</span>}
                </div>
                <div className={"sc-cell"+(vac?" kyuka":"")} style={{gridColumn:"span "+(HOURS_END-HOURS_START), height:58}}>
                  {blocks.filter(b=>b.staffId===s.id).map((b,i) => {
                    const isConf = conflictKeys.has(b.c.id+"|"+b.e.id+"|"+s.id);
                    return (
                    <div key={i} className={"sc-block"+(isConf?" conflict":"")} style={{
                        left: (b.startH-HOURS_START)*HOUR_W + 2,
                        width: b.dur*HOUR_W - 6,
                        background: s.color }}
                      onClick={()=>onOpenEdit(b.c, b.e)}>
                      {isConf && "🚨 "}<b>{custName(b.c)} 様</b>／{b.e.type}<br/>
                      ＠{b.c.use.venue || "場所未定"}
                    </div>
                  );})}
                </div>
              </React.Fragment>
            );})}
            {unassigned.length > 0 && (
              <React.Fragment>
                <div className="sc-staff" style={{color:"var(--red)"}}>⚠ 未割り当て</div>
                <div className="sc-cell" style={{gridColumn:"span "+(HOURS_END-HOURS_START), height:58}}>
                  {unassigned.map((b,i) => (
                    <div key={i} className="sc-block" style={{
                        left:(b.startH-HOURS_START)*HOUR_W + 2, width:b.dur*HOUR_W - 6,
                        background:"var(--red)" }}
                      onClick={()=>onOpenEdit(b.c, b.e)}>
                      <b>{custName(b.c)} 様</b>／{b.e.type}<br/>タップして担当を決めてください
                    </div>
                  ))}
                </div>
              </React.Fragment>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- マスター管理 ---------- */
function MasterView({ masters, setMasters, onBackup, onRestore, onResetDemo, saveStatus }){
  const [newName, setNewName] = useState({});
  const fileRef = useRef(null);
  const addTo = (key, obj) => {
    setMasters(prev => ({...prev, [key]:[...prev[key], obj]}));
    setNewName(prev => ({...prev, [key]:""}));
  };
  const delFrom = (key, idx) => setMasters(prev => ({...prev, [key]: prev[key].filter((_,i)=>i!==idx)}));
  const colors = ["#B76E79","#5B7FA6","#4A7C59","#C8901F","#8B6FAE","#A05B4C"];
  const listCard = (title, key, isObj) => (
    <div className="card">
      <h2>{title}</h2>
      {masters[key].map((v,i) => (
        <div key={i} className="row" style={{alignItems:"center", borderTop:"1px solid #F1EBE4", padding:"7px 0"}}>
          {isObj && <span className="avatar" style={{background:v.color}}>{v.name[0]}</span>}
          <span style={{flex:1, fontSize:14}}>{isObj ? v.name : v}
            {isObj && v.role==="master" && <span className="badge b-hon" style={{marginLeft:8}}>👑 マスター</span>}</span>
          <button className="btn btn-ghost btn-sm" onClick={()=>delFrom(key,i)}>削除</button>
        </div>
      ))}
      <div className="row" style={{marginTop:10}}>
        <input style={{flex:1}} placeholder="新しく追加" value={newName[key]||""}
          onChange={e=>setNewName(prev=>({...prev,[key]:e.target.value}))}/>
        <button className="btn btn-main btn-sm" onClick={()=>{
          const nm = (newName[key]||"").trim(); if(!nm) return;
          if(isObj) addTo(key, { id:genId(), name:nm, role:"staff", color:colors[masters[key].length%colors.length] });
          else addTo(key, nm);
        }}>追加</button>
      </div>
    </div>
  );
  return (
    <div>
      <div className="section-note">👑 この画面は<b>マスター（オーナー）専用</b>です。ここで登録した内容がカルテやタイム表の選択肢になります。</div>
      <div className="card">
        <h2>💾 データ管理</h2>
        <div className="meta" style={{marginBottom:10}}>
          入力したデータはこの端末に自動保存されています（状態：{saveStatus==="ok" ? "✅ 正常" : "⚠ 容量オーバーの可能性（写真を減らしてください）"}）。<br/>
          念のため、定期的に「バックアップを保存」でファイルにも残してください。別の端末に移すときは、そのファイルを「バックアップから復元」で読み込みます。
        </div>
        <div className="row">
          <button className="btn btn-main btn-sm" onClick={onBackup}>⬇ バックアップを保存</button>
          <button className="btn btn-sub btn-sm" onClick={()=>fileRef.current && fileRef.current.click()}>⬆ バックアップから復元</button>
          <button className="btn btn-ghost btn-sm" onClick={onResetDemo}>🔄 デモデータに戻す</button>
          <input type="file" accept=".json,application/json" ref={fileRef} style={{display:"none"}}
            onChange={e=>{ if(e.target.files[0]) onRestore(e.target.files[0]); e.target.value=""; }}/>
        </div>
        <div className="section-note" style={{marginTop:10}}>
          💡 本番版ではクラウド（Firebase）保存になり、全端末で自動共有・自動バックアップされます。
        </div>
      </div>
      {listCard("スタッフ", "staff", true)}
      {listCard("外注先", "vendors", true)}
      {listCard("使用場所", "venues", false)}
      {listCard("挙式スタイル", "styles", false)}
      <div className="card">
        <h2>従業員アカウント</h2>
        <div className="meta" style={{marginBottom:8}}>アカウントの発行・パスワード再設定はマスターだけが行えます（本番版で実装）</div>
        {masters.staff.map(s => (
          <div key={s.id} className="row" style={{alignItems:"center", borderTop:"1px solid #F1EBE4", padding:"7px 0"}}>
            <span className="avatar" style={{background:s.color}}>{s.name[0]}</span>
            <span style={{flex:1, fontSize:14}}>{s.name}</span>
            <span className={"badge "+(s.role==="master"?"b-hon":"b-gray")}>{s.role==="master"?"マスター":"従業員"}</span>
            <button className="btn btn-ghost btn-sm" disabled title="本番版で実装" style={{opacity:.45}}>パスワード再設定</button>
          </div>
        ))}
      </div>
    </div>
  );
}

        <div className="field"><label className="req">お客様のお名前</label>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="例）中村 様"/></div>
        <div className="field"><label className="req">ご希望日</label>
          <input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
        <div className="field"><label>受付スタッフ</label>
          <select value={staff} onChange={e=>setStaff(e.target.value)}>
            <option value="">選択してください</option>
            {masters.staff.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}
          </select></div>
        <div className="field"><label>メモ</label>
          <textarea rows="2" value={memo} onChange={e=>setMemo(e.target.value)} placeholder="ご紹介元、ご希望など"/></div>
        {err && <div style={{color:"var(--red)", fontSize:12.5, marginBottom:8}}>{err}</div>}
        <div className="row">
          <button className="btn btn-main" style={{flex:1}} onClick={submit}>登録する</button>
          <button className="btn btn-ghost" onClick={onClose}>やめる</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- アプリ本体 ---------- */
function App(){
  const saved = React.useMemo(loadSaved, []);
  const [user, setUser] = useState(null);
  const [tab, setTab] = useState("home");
  const [detailId, setDetailId] = useState(null);
  const [estId, setEstId] = useState(null);
  const [editing, setEditing] = useState(null);
  const [editingEvent, setEditingEvent] = useState(null);
  const [schedDate, setSchedDate] = useState(iso(TODAY));
  const [showProv, setShowProv] = useState(false);
  const [customers, setCustomers] = useState(saved ? saved.customers : initialCustomers);
  const [masters, setMasters] = useState(saved ? saved.masters : initialMasters);
  const [vacations, setVacations] = useState(saved ? saved.vacations : initialVacations);
  const [saveStatus, setSaveStatus] = useState("ok");
  const isMaster = user && user.role === "master";

  useEffect(() => {
    try{
      localStorage.setItem(LS_KEY, JSON.stringify({ customers, masters, vacations, ver:VERSION }));
      setSaveStatus("ok");
    }catch(e){ console.warn("自動保存に失敗:", e); setSaveStatus("error"); }
  }, [customers, masters, vacations]);

  if(!user) return <LoginScreen masters={masters} onLogin={setUser} />;

  const openCustomer = (id) => { setDetailId(id); setEstId(null); setEditing(null); setEditingEvent(null); setTab("home"); window.scrollTo(0,0); };
  const openEst = (id) => { setEstId(id); setDetailId(null); setEditing(null); setTab("home"); window.scrollTo(0,0); };
  const goDate = (d) => { setSchedDate(d); setDetailId(null); setEstId(null); setTab("sched"); window.scrollTo(0,0); };
  const saveCustomer = (c) => {
    if(c.id){ setCustomers(prev => prev.map(x => x.id===c.id ? c : x)); setDetailId(c.id); }
    else { const nc = {...c, id:genId()}; setCustomers(prev => [...prev, nc]); setDetailId(nc.id); }
    setEditing(null); setTab("home"); window.scrollTo(0,0);
  };
  const saveEvent = (custId, eventId, patch) => {
    setCustomers(prev => prev.map(c => c.id!==custId ? c :
      {...c, events: c.events.map(e => e.id===eventId ? {...e, ...patch} : e)}));
    setEditingEvent(null);
    if(patch.date) setSchedDate(patch.date);
  };
  const saveProv = ({name, date, memo, staff}) => {
    const nc = {...blankCustomer(), id:genId(), status:"仮予約", enteredBy:staff || user.name,
      bride:{...blankPerson(), name},
      use:{...blankCustomer().use, date},
      events:[{ id:genId(), type:"その他", date, time:"", dur:2, staffIds:[], note:"仮予約" }],
      note: memo};
    setCustomers(prev => [...prev, nc]);
    setShowProv(false); setTab("cal");
  };
  const doBackup = () => {
    const data = JSON.stringify({ customers, masters, vacations, ver:VERSION,
      exportedAt: new Date().toLocaleString("ja-JP") }, null, 2);
    const blob = new Blob([data], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "美容タスク管理_バックアップ_" + iso(new Date()).replace(/-/g,"") + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  };
  const doRestore = (file) => {
    const fr = new FileReader();
    fr.onload = (ev) => {
      try{
        const j = JSON.parse(ev.target.result);
        if(!j || !Array.isArray(j.customers)) throw new Error("形式が違います");
        if(!window.confirm("バックアップファイルの内容で置き換えます。今のデータは上書きされます。よろしいですか？")) return;
        setCustomers(j.customers.map(normalizeCustomer));
        if(j.masters && j.masters.staff) setMasters(j.masters);
        setVacations(Array.isArray(j.vacations) ? j.vacations : []);
        alert("復元しました ✅");
      }catch(e){ alert("復元できませんでした。バックアップファイル（.json）か確認してください。"); }
    };
    fr.readAsText(file);
  };
  const doResetDemo = () => {
    if(!window.confirm("入力したデータを消して、最初のデモデータに戻します。よろしいですか？")) return;
    localStorage.removeItem(LS_KEY);
    location.reload();
  };

  const NAVS = [
    ["home","🏠","ホーム","ホーム"], ["cal","📅","カレンダー","カレンダー"],
    ["sched","⏱","タイム表","タイム表"], ["new","📝","新規カルテ","カルテ"],
    ["estlist","📄","見積書一覧","見積"], ["invlist","🧾","請求書一覧","請求"],
  ];
  if(isMaster) NAVS.push(["master","👑","マスター","マスター"]);
  const changeTab = (t) => {
    setTab(t); setDetailId(null); setEstId(null); setEditingEvent(null);
    setEditing(t==="new" ? blankCustomer() : null);
    window.scrollTo(0,0);
  };

  let body = null;
  const detailC = detailId && customers.find(c=>c.id===detailId);
  const estC = estId && customers.find(c=>c.id===estId);
  if(editing){
    body = <KarteForm masters={masters} initial={editing} user={user}
      onSave={saveCustomer} onCancel={()=>{ setEditing(null); if(!editing.id) setTab("home"); }} />;
  } else if(estC){
    body = <EstimateView c={estC} user={user} onBack={()=>openCustomer(estC.id)}
      onUpdate={(nc)=>setCustomers(prev=>prev.map(x=>x.id===nc.id?nc:x))} />;
  } else if(detailC){
    body = <CustomerDetail c={detailC} masters={masters}
      onEdit={()=>setEditing(detailC)} onOpenEst={openEst}
      onBack={()=>setDetailId(null)} onGoDate={goDate} />;
  } else if(tab==="home"){
    body = <HomeView customers={customers} masters={masters}
      onOpen={openCustomer} onOpenEst={openEst} onGoDate={goDate} />;
  } else if(tab==="cal"){
    body = <CalendarView customers={customers} masters={masters}
      vacations={vacations} setVacations={setVacations} onPickDate={goDate} />;
  } else if(tab==="sched"){
    body = <ScheduleView customers={customers} masters={masters} vacations={vacations}
      date={schedDate} setDate={setSchedDate}
      onOpenEdit={(c,e)=>setEditingEvent({custId:c.id, eventId:e.id})} />;
  } else if(tab==="estlist"){
    body = <EstListView customers={customers} onOpenEst={openEst} onOpenCust={openCustomer} />;
  } else if(tab==="invlist"){
    body = <InvListView customers={customers} onOpenCust={openCustomer} />;
  } else if(tab==="master" && isMaster){
    body = <MasterView masters={masters} setMasters={setMasters}
      onBackup={doBackup} onRestore={doRestore} onResetDemo={doResetDemo} saveStatus={saveStatus} />;
  }

  const evC = editingEvent && customers.find(c=>c.id===editingEvent.custId);
  const evE = evC && evC.events.find(e=>e.id===editingEvent.eventId);

  return (
    <div>
      <header className="app-header">
        <div>
          <div className="app-title">Bridal Beauty タスク管理</div>
          <div className="ver">{VERSION}（デモ版）　{saveStatus==="ok" ? "💾 自動保存ON" : "⚠ 保存容量オーバー"}</div>
        </div>
        <div className="userchip">
          <span className="avatar" style={{background:user.color}}>{user.name[0]}</span>
          <div>{user.name}<br/><b style={{color:isMaster?"var(--rose-dark)":"var(--sub)"}}>{isMaster?"👑 マスター":"従業員"}</b></div>
          <button className="btn btn-ghost btn-sm" onClick={()=>setUser(null)}>ログアウト</button>
        </div>
      </header>
      <nav className="nav-desktop">
        {NAVS.map(([k,ico,label]) => (
          <button key={k} className={tab===k && !detailId && !estId ? "on":""} onClick={()=>changeTab(k)}>{ico} {label}</button>
        ))}
      </nav>
      <main className="main">{body}</main>
      {!editing && <button className="fab" onClick={()=>setShowProv(true)}>＋ 仮予約</button>}
      {showProv && <ProvisionalModal masters={masters} onSave={saveProv} onClose={()=>setShowProv(false)} />}
      {evC && evE && <EventEditModal c={evC} e={evE} customers={customers} vacations={vacations}
        masters={masters} onSave={saveEvent}
        onOpenKarte={(id)=>{ setEditingEvent(null); openCustomer(id); }}
        onClose={()=>setEditingEvent(null)} />}
      <nav className="nav-mobile">
        {NAVS.map(([k,ico,label,short]) => (
          <button key={k} className={tab===k && !detailId && !estId ? "on":""} onClick={()=>changeTab(k)}>
            <span className="ico">{ico}</span>{short}</button>
        ))}
      </nav>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
